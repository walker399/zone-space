<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Space - تسجيل الدخول</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap');

:root {
    /* Premium Palette Settings */
    --primary-color: #064e3b; /* Dark Green */
    --primary-light: #0f766e;
    --secondary-color: #10b981; /* Green */
    --secondary-light: #34d399;
    
    --bg-main: #f8fafc;
    --bg-sidebar: #064e3b;
    --bg-card: #ffffff;
    
    --text-main: #1e293b;
    --text-muted: #64748b;
    --text-white: #ffffff;
    --border-color: #e2e8f0;
    
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;

    /* Styling Properties */
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(6, 78, 59, 0.05), 0 2px 4px -1px rgba(6, 78, 59, 0.03);
    --shadow-lg: 0 10px 25px -5px rgba(6, 78, 59, 0.1), 0 8px 10px -6px rgba(6, 78, 59, 0.05);
    
    --transition-fast: 0.15s ease-in-out;
    --transition-normal: 0.25s ease-in-out;
    
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-full: 9999px;
}

body.dark {
    --bg-main: #0b0f19;
    --bg-sidebar: #052e24;
    --bg-card: #151f32;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
    
    --shadow-md: 0 10px 20px rgba(0, 0, 0, 0.2);
    --shadow-lg: 0 20px 30px rgba(0, 0, 0, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cairo', 'Outfit', sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    transition: background-color var(--transition-normal), color var(--transition-normal);
    direction: rtl;
    text-align: right;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Auth Pages Styling */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, var(--primary-color) 0%, #083b2d 100%);
    position: relative;
    overflow: hidden;
}

.auth-container::before {
    content: '';
    position: absolute;
    width: 350px;
    height: 350px;
    background: var(--secondary-color);
    filter: blur(120px);
    opacity: 0.15;
    border-radius: 50%;
    top: -50px;
    right: -50px;
}

.auth-card {
    background: var(--bg-card);
    padding: 40px;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    width: 100%;
    max-width: 440px;
    z-index: 10;
    transition: background-color var(--transition-normal);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.auth-logo {
    text-align: center;
    margin-bottom: 25px;
}

.auth-logo span {
    font-size: 2.8rem;
    display: block;
}

.auth-logo h1 {
    color: var(--primary-color);
    font-size: 1.85rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-top: 8px;
}

body.dark .auth-logo h1 {
    color: var(--secondary-color);
}

/* Core SPA Layout styling */
.app-container {
    display: flex;
    min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
    width: 280px;
    background-color: var(--bg-sidebar);
    padding: 25px 20px;
    color: var(--text-white);
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    right: 0;
    top: 0;
    z-index: 100;
    box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
    transition: background-color var(--transition-normal);
    overflow-y: auto;
}

.logo-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 35px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo-icon {
    font-size: 1.85rem;
}

.logo-text h2 {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--text-white);
}

.logo-text span {
    font-size: 0.7rem;
    color: var(--secondary-color);
    letter-spacing: 1.5px;
    font-weight: 600;
    display: block;
}

.user-profile-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: var(--radius-md);
    margin-bottom: 25px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--secondary-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.15rem;
    color: var(--primary-color);
}

.user-info-text h4 {
    font-size: 0.9rem;
    font-weight: 700;
}

.user-info-text span {
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.55);
}

.nav-menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-grow: 1;
}

.nav-item a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-weight: 600;
    transition: all var(--transition-fast);
}

.nav-item a:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-white);
    transform: translateX(-5px);
}

.nav-item.active a {
    background: var(--secondary-color);
    color: var(--primary-color);
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
}

.sidebar-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.theme-toggle-btn, .logout-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-white);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-weight: 600;
    transition: all var(--transition-fast);
    justify-content: center;
}

.theme-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.1);
}

.logout-btn {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
}

.logout-btn:hover {
    background: rgba(239, 68, 68, 0.3);
    color: #ffffff;
}

/* Content Frame */
.main-content {
    margin-right: 280px;
    width: calc(100% - 280px);
    padding: 35px;
    min-height: 100vh;
}

.page-section {
    display: none;
    animation: slideUpFade 0.3s ease-out;
}

.page-section.active {
    display: block;
}

@keyframes slideUpFade {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-header {
    display: flex;
    justify-content: justify;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h1 {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .page-header h1 {
    color: var(--secondary-color);
}

/* Inputs & Form Controls */
.form-group {
    margin-bottom: 18px;
    position: relative;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-main);
}

.form-control {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border-color);
    background-color: var(--bg-card);
    color: var(--text-main);
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    transition: all var(--transition-fast);
}

.form-control:focus {
    outline: none;
    border-color: var(--secondary-color);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.btn:active {
    transform: scale(0.97);
}

.btn-primary {
    background-color: var(--primary-color);
    color: var(--text-white);
}

.btn-primary:hover {
    background-color: var(--primary-light);
    box-shadow: 0 4px 10px rgba(6, 78, 59, 0.15);
}

body.dark .btn-primary {
    background-color: var(--secondary-color);
    color: var(--primary-color);
}

body.dark .btn-primary:hover {
    background-color: var(--secondary-light);
}

.btn-secondary {
    background-color: var(--border-color);
    color: var(--text-main);
}

.btn-secondary:hover {
    background-color: var(--text-muted);
    color: var(--bg-card);
}

.btn-danger {
    background-color: var(--danger);
    color: var(--text-white);
}

.btn-danger:hover {
    background-color: #dc2626;
    box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
}

.btn-success {
    background-color: var(--success);
    color: var(--text-white);
}

.btn-success:hover {
    background-color: #059669;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
}

/* "تخصيص" actions dropdown menu (receipts tables) */
.dropdown-actions {
    display: inline-block;
    position: relative;
}

.dropdown-menu {
    display: none;
    position: fixed;
    min-width: 170px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    z-index: 1000;
}

.dropdown-menu.open {
    display: block;
}

.dropdown-menu button {
    display: block;
    width: 100%;
    text-align: right;
    padding: 10px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text-main);
}

.dropdown-menu button:hover {
    background-color: var(--border-color);
}

.dropdown-menu button.danger {
    color: var(--danger);
}

.dropdown-menu .menu-divider {
    height: 1px;
    background: var(--border-color);
    margin: 4px 0;
}

/* Banner Notices */
.alert-banner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(90%, 420px);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
    animation: slideDown 0.3s ease;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    z-index: 2000;
}

.alert-danger {
    display: block;
    background-color: rgba(239, 68, 68, 0.1);
    border-right: 4px solid var(--danger);
    color: var(--danger);
}

.alert-success {
    display: block;
    background-color: rgba(16, 185, 129, 0.1);
    border-right: 4px solid var(--success);
    color: var(--success);
}

.alert-warning {
    display: block;
    background-color: rgba(245, 158, 11, 0.1);
    border-right: 4px solid var(--warning);
    color: var(--warning);
}

.alert-info {
    display: block;
    background-color: rgba(37, 99, 235, 0.1);
    border-right: 4px solid var(--primary-color, #2563eb);
    color: var(--primary-color, #2563eb);
}

/* Dashboard Layout Grid */
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background-color: var(--bg-card);
    padding: 22px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
}

.stat-card::after {
    content: '';
    position: absolute;
    width: 5px;
    height: 100%;
    background-color: var(--secondary-color);
    top: 0;
    right: 0;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.stat-header {
    display: flex;
    justify-content: justify;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.stat-title {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 700;
}

.stat-icon {
    font-size: 1.35rem;
}

.stat-value {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .stat-value {
    color: var(--secondary-color);
}

.stat-footer {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* Graph Panel container */
.chart-panel {
    background-color: var(--bg-card);
    padding: 25px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    margin-bottom: 30px;
}

.chart-header {
    display: flex;
    justify-content: justify;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.chart-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .chart-title {
    color: var(--secondary-color);
}

.chart-container {
    position: relative;
    height: 320px;
    width: 100%;
}

/* Quick list used on the dashboard instead of the revenue chart */
.quick-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.quick-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm, 8px);
}

.quick-list-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.quick-list-title {
    font-weight: 700;
    color: var(--text-main);
    font-size: 0.9rem;
}

.quick-list-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
}

.quick-list-sub-warning {
    color: var(--warning);
    font-weight: 700;
}

.quick-list-sub-danger {
    color: var(--danger);
    font-weight: 700;
}

.quick-list-amount {
    font-weight: 800;
    color: var(--primary-color);
    font-size: 0.9rem;
    white-space: nowrap;
}

.quick-list-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 20px;
    font-size: 0.85rem;
}

/* Custom Table Panels */
.panel-card {
    background-color: var(--bg-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    overflow: hidden;
    margin-bottom: 30px;
}

.panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: justify;
    justify-content: space-between;
    align-items: center;
}

.panel-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .panel-title {
    color: var(--secondary-color);
}

.table-responsive {
    overflow-x: auto;
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: right;
}

th {
    background-color: rgba(6, 78, 59, 0.03);
    color: var(--primary-color);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-color);
}

body.dark th {
    background-color: rgba(16, 185, 129, 0.04);
    color: var(--secondary-color);
}

td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.9rem;
    color: var(--text-main);
}

tr:last-child td {
    border-bottom: none;
}

tr:hover td {
    background-color: rgba(16, 185, 129, 0.02);
}

/* Badges for status */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: var(--radius-full);
}

.badge-active {
    background-color: rgba(16, 185, 129, 0.1);
    color: var(--success);
}

.badge-suspended {
    background-color: rgba(239, 68, 68, 0.1);
    color: var(--danger);
}

.badge-daily {
    background-color: rgba(59, 130, 246, 0.1);
    color: var(--info);
}

.badge-weekly {
    background-color: rgba(245, 158, 11, 0.1);
    color: var(--warning);
}

.badge-monthly {
    background-color: rgba(16, 185, 129, 0.1);
    color: var(--success);
}

/* Modals layout */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s ease;
}

.modal-card {
    background-color: var(--bg-card);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    animation: zoomIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes zoomIn {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.modal-header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: justify;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(6, 78, 59, 0.02);
}

.modal-header h3 {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .modal-header h3 {
    color: var(--secondary-color);
}

.modal-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--text-muted);
    transition: color var(--transition-fast);
}

.modal-close:hover {
    color: var(--danger);
}

.modal-body {
    padding: 22px;
}

.modal-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* Subscription Buttons picker */
.subscription-options {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.sub-btn-option {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    border: 2px dashed var(--border-color);
    border-radius: var(--radius-md);
    background: none;
    cursor: pointer;
    transition: all var(--transition-normal);
}

.sub-btn-option:hover {
    border-color: var(--secondary-color);
    background-color: rgba(16, 185, 129, 0.04);
    transform: translateY(-2px);
}

.sub-btn-option.selected {
    border-color: var(--secondary-color);
    border-style: solid;
    background-color: rgba(16, 185, 129, 0.06);
}

.sub-btn-option span.emoji {
    font-size: 2rem;
    margin-bottom: 8px;
}

.sub-btn-option span.title {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--primary-color);
}

body.dark .sub-btn-option span.title {
    color: var(--secondary-color);
}

.sub-btn-option span.price {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
}

/* Search bar Filters */
.search-filter-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.search-box {
    flex: 2;
    min-width: 240px;
}

.filter-box {
    flex: 1;
    min-width: 140px;
}

/* Switches (Toggles) */
.switch-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #cbd5e1;
    transition: .3s;
    border-radius: 24px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: var(--secondary-color);
}

input:checked + .slider:before {
    transform: translateX(24px);
}

/* Thermal Paper layout */
.receipt-paper {
    background: #ffffff;
    color: #000000;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    padding: 16px;

    <div class="auth-card">

            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 5px; font-weight: bold;">
                <span>superadmin</span>
                <span>admin</span>
                <span>user</span>

    <!-- DB and Session handlers -->
    <script>
/**
 * Zone Space Database Persistence Layer (localStorage SQL Simulator)
 * Saved in cbl-m1 folder
 * Default password is '12345'
 * Sequential receipt number format '000001'
 */

const DB_PREFIX = "zonespace_cbl_";

const db = {
    hashPassword(password) {
        let hash = 0;
        for (let i = 0; i < password.length; i++) {
            const char = password.charCodeAt(i);
            hash = (hash << 5) - hash + char;
            hash |= 0;
        }
        return "zs_hash_" + Math.abs(hash) + "_" + btoa(password).replace(/=/g, "");
    },

    verifyPassword(password, storedHash) {
        return this.hashPassword(password) === storedHash;
    },

    _read(table) {
        const data = localStorage.getItem(DB_PREFIX + table);
        return data ? JSON.parse(data) : [];
    },

    _write(table, data) {
        localStorage.setItem(DB_PREFIX + table, JSON.stringify(data));
    },

    init() {
        if (!localStorage.getItem(DB_PREFIX + "users")) {
            const defaultUsers = [
                {
                    id: 1,
                    username: "superadmin",
                    password: this.hashPassword("12345"),
                    fullname: "المدير العام (Super Admin)",
                    role: "SuperAdmin",
                    status: "Active",
                    createdAt: new Date().toISOString()
                },
                {
                    id: 2,
                    username: "admin",
                    password: this.hashPassword("12345"),
                    fullname: "مدير النظام (Admin)",
                    role: "Admin",
                    status: "Active",
                    createdAt: new Date().toISOString()
                },
                {
                    id: 3,
                    username: "user",
                    password: this.hashPassword("12345"),
                    fullname: "موظف مبيعات (User)",
                    role: "User",
                    status: "Active",
                    createdAt: new Date().toISOString()
                }
            ];
            this._write("users", defaultUsers);
        }

        const defaultSettings = {
            systemName: "ZONE SPACE",
            systemLogo: "🟢",
            currency: "LYD",
            receiptFooter: "شكراً لزيارتكم - ZONE SPACE",
            dailyPrice: 10.00,
            weeklyPrice: 70.00,
            monthlyPrice: 400.00
        };

        const initialData = window.initialZoneSpaceData || {};

        if (!localStorage.getItem(DB_PREFIX + "settings")) {
            const settings = { ...defaultSettings, ...(initialData.settings || {}) };
            localStorage.setItem(DB_PREFIX + "settings", JSON.stringify(settings));
        }

        const tables = ["subscribers", "receipts", "payments", "bookings", "closings", "monthly_closings", "activity_logs"];
        tables.forEach(table => {
            if (!localStorage.getItem(DB_PREFIX + table)) {
                if (Array.isArray(initialData[table])) {
                    this._write(table, initialData[table]);
                } else {
                    this._write(table, []);
                }
            }
        });

        this.logActivity(1, "superadmin", "System Initialized", "تم تهيئة قاعدة البيانات بنجاح في مجلد cbl-m1.");
    },

    getUsers() {
        return this._read("users");
    },

    getUserById(id) {
        return this.getUsers().find(u => u.id === parseInt(id));
    },

    getUserByUsername(username) {
        return this.getUsers().find(u => u.username.toLowerCase() === username.toLowerCase());
    },

    saveUser(user) {
        const users = this.getUsers();
        if (user.id) {
            const index = users.findIndex(u => u.id === parseInt(user.id));
            if (index !== -1) {
                if (user.password && !user.password.startsWith("zs_hash_")) {
                    user.password = this.hashPassword(user.password);
                } else {
                    user.password = users[index].password;
                }
                users[index] = { ...users[index], ...user, id: parseInt(user.id) };
                this._write("users", users);
                return users[index];
            }
        } else {
            const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;
            const newUser = {
                id: newId,
                username: user.username,
                password: this.hashPassword(user.password || "12345"),
                fullname: user.fullname,
                role: user.role || "User",
                status: user.status || "Active",
                createdAt: new Date().toISOString()
            };
            users.push(newUser);
            this._write("users", users);
            return newUser;
        }
        return null;
    },

    deleteUser(id) {
        const users = this.getUsers();
        const updated = users.filter(u => u.id !== parseInt(id));
        this._write("users", updated);
        return true;
    },

    getSubscribers() {
        return this._read("subscribers");
    },

    addSubscriber(name, phone) {
        const subscribers = this.getSubscribers();
        const existing = subscribers.find(s => s.name.trim() === name.trim() && s.phone === phone);
        if (existing) return existing;

        const newId = subscribers.length > 0 ? Math.max(...subscribers.map(s => s.id)) + 1 : 1;
        const newSub = {
            id: newId,
            name: name.trim(),
            phone: phone || "",
            createdAt: new Date().toISOString()
        };
        subscribers.push(newSub);
        this._write("subscribers", subscribers);
        return newSub;
    },

    getReceipts() {
        return this._read("receipts");
    },

    getNextReceiptNo() {
        const receipts = this.getReceipts();
        const nextNum = receipts.length + 1;
        return String(nextNum).padStart(6, "0");
    },

    getReceiptById(receiptId) {
        return this.getReceipts().find(r => r.id === parseInt(receiptId, 10));
    },

    cancelReceipt(receiptId) {
        const receipts = this.getReceipts();
        const index = receipts.findIndex(r => r.id === parseInt(receiptId, 10));
        if (index === -1) return null;

        receipts[index].status = 'Cancelled';
        this._write("receipts", receipts);
        return receipts[index];
    },

    activateReceipt(receiptId) {
        const receipts = this.getReceipts();
        const index = receipts.findIndex(r => r.id === parseInt(receiptId, 10));
        if (index === -1) return null;

        receipts[index].status = 'Active';
        this._write("receipts", receipts);
        return receipts[index];
    },

    updateReceipt(receiptId, updates) {
        const receipts = this.getReceipts();
        const index = receipts.findIndex(r => r.id === parseInt(receiptId, 10));
        if (index === -1) return null;

        const allowedFields = ['subType', 'amount', 'startDate', 'endDate', 'comment', 'status', 'paymentMethod', 'serialNumber'];
        allowedFields.forEach(field => {
            if (updates[field] !== undefined) {
                receipts[index][field] = field === 'amount' ? parseFloat(updates[field]) : updates[field];
            }
        });

        this._write("receipts", receipts);
        return receipts[index];
    },

    deleteReceipt(receiptId) {
        const receipts = this.getReceipts();
        const remaining = receipts.filter(r => r.id !== parseInt(receiptId, 10));
        this._write("receipts", remaining);

        const payments = this.getPayments();
        const remainingPayments = payments.filter(p => p.receiptId !== parseInt(receiptId, 10));
        this._write("payments", remainingPayments);
        return true;
    },

    addReceipt(receiptData) {
        const receipts = this.getReceipts();
        const newId = receipts.length > 0 ? Math.max(...receipts.map(r => r.id)) + 1 : 1;
        const receiptNo = this.getNextReceiptNo();

        const newReceipt = {
            id: newId,
            receiptNo: receiptNo,
            subscriberId: receiptData.subscriberId || null,
            subType: receiptData.subType,
            amount: parseFloat(receiptData.amount),
            startDate: receiptData.startDate || null,
            endDate: receiptData.endDate || null,
            comment: receiptData.comment || '',
            status: receiptData.status || 'Active',
            paymentMethod: receiptData.paymentMethod || 'Cash',
            serialNumber: receiptData.serialNumber || null,
            createdBy: receiptData.createdBy,
            createdAt: new Date().toISOString()
        };

        receipts.push(newReceipt);
        this._write("receipts", receipts);

        this.addPayment(newId, newReceipt.amount);

        return newReceipt;
    },

    getPayments() {
        return this._read("payments");
    },

    addPayment(receiptId, amount) {
        const payments = this.getPayments();
        const newId = payments.length > 0 ? Math.max(...payments.map(p => p.id)) + 1 : 1;
        const newPayment = {
            id: newId,
            receiptId: receiptId,
            amount: parseFloat(amount),
            paymentDate: new Date().toISOString()
        };
        payments.push(newPayment);
        this._write("payments", payments);
        return newPayment;
    },

    getBookings() {
        return this._read("bookings");
    },

    addBooking(bookingData) {
        const bookings = this.getBookings();
        const newId = bookings.length > 0 ? Math.max(...bookings.map(b => b.id)) + 1 : 1;

        // Register/reuse the client as a subscriber, and issue a receipt sharing
        // the same sequential numbering used for subscription receipts.
        const subscriber = this.addSubscriber(bookingData.name, bookingData.phone);
        const receipt = this.addReceipt({
            subscriberId: subscriber.id,
            subType: 'Booking',
            amount: parseFloat(bookingData.total),
            startDate: new Date().toISOString().split('T')[0],
            endDate: null,
            comment: `حجز ${bookingData.room} - ${bookingData.hours} ساعة`,
            status: 'Active',
            createdBy: bookingData.createdBy || 'unknown'
        });

        const newBooking = {
            id: newId,
            room: bookingData.room,
            name: bookingData.name,
            phone: bookingData.phone,
            hours: parseInt(bookingData.hours, 10),
            rate: parseFloat(bookingData.rate),
            total: parseFloat(bookingData.total),
            notes: bookingData.notes || '',
            status: 'Confirmed',
            receiptId: receipt.id,
            receiptNo: receipt.receiptNo,
            createdAt: new Date().toISOString()
        };
        bookings.push(newBooking);
        this._write("bookings", bookings);
        return newBooking;
    },

    updateBooking(bookingId, updates) {
        const bookings = this.getBookings();
        const index = bookings.findIndex(b => b.id === parseInt(bookingId, 10));
        if (index === -1) return null;

        const allowedFields = ['room', 'name', 'phone', 'hours', 'rate', 'total', 'notes'];
        allowedFields.forEach(field => {
            if (updates[field] === undefined) return;
            if (field === 'hours') {
                bookings[index][field] = parseInt(updates[field], 10);
            } else if (field === 'rate' || field === 'total') {
                bookings[index][field] = parseFloat(updates[field]);
            } else {
                bookings[index][field] = updates[field];
            }
        });

        this._write("bookings", bookings);

        // Keep the linked receipt's amount/comment in sync with the booking
        if (bookings[index].receiptId) {
            this.updateReceipt(bookings[index].receiptId, {
                amount: bookings[index].total,
                comment: `حجز ${bookings[index].room} - ${bookings[index].hours} ساعة`
            });
        }

        return bookings[index];
    },

    toggleBookingStatus(bookingId) {
        const bookings = this.getBookings();
        const index = bookings.findIndex(b => b.id === parseInt(bookingId, 10));
        if (index === -1) return null;
        bookings[index].status = bookings[index].status === 'Confirmed' ? 'Cancelled' : 'Confirmed';
        this._write("bookings", bookings);
        return bookings[index];
    },

    getClosings() {
        return this._read("closings");
    },

    // Closes today's not-yet-closed receipts (subscriptions/bookings all share the
    // Receipts table) created by `username`. Marks them with a closingId — nothing is
    // deleted — and stores a totals summary in the closings log.
    closeDailyAccount(username) {
        const today = new Date().toISOString().split('T')[0];
        const receipts = this.getReceipts();

        const eligible = receipts.filter(r =>
            r.createdBy === username &&
            !r.closingId &&
            (r.createdAt || '').split('T')[0] === today
        );

        if (eligible.length === 0) return null;

        const closings = this.getClosings();
        const newId = closings.length > 0 ? Math.max(...closings.map(c => c.id)) + 1 : 1;

        const totalCash = eligible.filter(r => (r.paymentMethod || 'Cash') === 'Cash').reduce((s, r) => s + r.amount, 0);
        const totalCard = eligible.filter(r => r.paymentMethod === 'Card').reduce((s, r) => s + r.amount, 0);

        const newClosing = {
            id: newId,
            closedBy: username,
            receiptsCount: eligible.length,
            totalCash,
            totalCard,
            totalAmount: totalCash + totalCard,
            dateClosed: today,
            closedAt: new Date().toISOString()
        };

        eligible.forEach(r => { r.closingId = newId; });
        this._write("receipts", receipts);

        closings.push(newClosing);
        this._write("closings", closings);
        return newClosing;
    },

    getSettings() {
        const settings = localStorage.getItem(DB_PREFIX + "settings");
        return settings ? JSON.parse(settings) : {};
    },

    saveSettings(newSettings) {
        const current = this.getSettings();
        const updated = { ...current, ...newSettings };
        localStorage.setItem(DB_PREFIX + "settings", JSON.stringify(updated));
        return updated;
    },

    getLogs() {
        return this._read("activity_logs");
    },

    logActivity(userId, username, action, details) {
        const logs = this.getLogs();
        const newId = logs.length > 0 ? Math.max(...logs.map(l => l.id)) + 1 : 1;
        const newLog = {
            id: newId,
            userId: userId,
            username: username,
            action: action,
            details: details || "",
            timestamp: new Date().toISOString()
        };
        logs.push(newLog);
        this._write("activity_logs", logs);
        if (logs.length > 1000) {
            logs.shift();
            this._write("activity_logs", logs);
        }
        return newLog;
    }
};

db.init();
window.db = db;

    </script>
    <script>
/**
 * Zone Space Authentication System
 */

const auth = {
    // Attempt Login
    login(username, password) {
        if (!username || !password) {
            return { success: false, message: "يرجى إدخال اسم المستخدم وكلمة المرور" };
        }

        const user = window.db.getUserByUsername(username);

        if (!user) {
            return { success: false, message: "اسم المستخدم أو كلمة المرور غير صحيحة" };
        }

        // Check if account is Suspended
        if (user.status === "Suspended") {
            window.db.logActivity(user.id, user.username, "Login Attempt Blocked", "محاولة دخول فاشلة للمستخدم لأن الحساب موقوف.");
            return { 
                success: false, 
                message: "حسابك موقوف، يرجى مراجعة الإدارة" 
            };
        }

        // Verify password
        if (!window.db.verifyPassword(password, user.password)) {
            return { success: false, message: "اسم المستخدم أو كلمة المرور غير صحيحة" };
        }

        // Save session (simulating JWT session token)
        const sessionToken = "zs_token_" + Math.random().toString(36).substr(2) + "_" + btoa(user.username);
        const sessionData = {
            token: sessionToken,
            user: {
                id: user.id,
                username: user.username,
                fullname: user.fullname,
                role: user.role,
                status: user.status
            },
            loginTime: new Date().toISOString()
        };

        localStorage.setItem("zonespace_cbl_session", JSON.stringify(sessionData));
        window.db.logActivity(user.id, user.username, "Login", "تم تسجيل الدخول بنجاح.");
        return { success: true, user: sessionData.user };
    },

    // Perform Logout
    logout() {
        const currentUser = this.getCurrentUser();
        if (currentUser) {
            window.db.logActivity(currentUser.id, currentUser.username, "Logout", "تم تسجيل الخروج.");
        }
        localStorage.removeItem("zonespace_cbl_session");
        window.location.href = "login.html";
    },

    // Get current user details and check status
    getCurrentUser() {
        const sessionStr = localStorage.getItem("zonespace_cbl_session");
        if (!sessionStr) return null;

        try {
            const session = JSON.parse(sessionStr);
            const dbUser = window.db.getUserById(session.user.id);
            if (!dbUser || dbUser.status === "Suspended") {
                // Instantly force logout if they were suspended during session
                localStorage.removeItem("zonespace_cbl_session");
                return null;
            }
            return dbUser;
        } catch (e) {
            return null;
        }
    },

    // Check if session is active
    isLoggedIn() {
        return this.getCurrentUser() !== null;
    },

    // Check role authorization
    checkRole(allowedRoles) {
        const user = this.getCurrentUser();
        if (!user) return false;
        return allowedRoles.includes(user.role);
    },

    // Redirect handler
    checkAuthRedirect() {
        const user = this.getCurrentUser();
        const currentPage = window.location.pathname.split("/").pop();

        if (!user && currentPage !== "login.html") {
            window.location.href = "login.html";
        } else if (user && currentPage === "login.html") {
            window.location.href = "index.html";
        }
    }
};

window.auth = auth;

    </script>
    
    <script>
        // Redirect if already logged in
        auth.checkAuthRedirect();

        // Apply branding
        const settings = db.getSettings();
        if (settings) {
            if (settings.systemName) document.getElementById('logo-title').innerText = settings.systemName;
            if (settings.systemLogo) document.getElementById('logo-icon').innerText = settings.systemLogo;
        }

        // Dark mode setup
        if (localStorage.getItem('zonespace_dark_mode') === 'enabled') {
            document.body.classList.add('dark');
        }

        // Form Submit
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            alertBox.style.display = 'none';

            const result = auth.login(usernameInput, passwordInput);

            if (result.success) {
                window.location.href = 'index.html';
            } else {
                alertBox.innerText = result.message;
                alertBox.style.display = 'block';
                
                // Card shake effect
                const card = document.querySelector('.auth-card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => card.style.transform = 'translateX(-10px)', 80);
                setTimeout(() => card.style.transform = 'translateX(5px)', 160);
                setTimeout(() => card.style.transform = 'translateX(-5px)', 240);
                setTimeout(() => card.style.transform = 'translateX(0)', 320);
            }
        });
    </script>
